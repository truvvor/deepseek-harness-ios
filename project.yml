name: HarnessMobile
options:
  bundleIdPrefix: com.llf
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  HarnessMobileCore:
    path: .
targets:
  HarnessMobile:
    type: application
    platform: iOS
    entitlements:
      path: HarnessMobile/HarnessMobile.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobile
        excludes:
          # AI collaboration rules are source-adjacent documentation, not
          # application resources. Keeping them out of the target also avoids
          # colliding `AGENTS.md` bundle names when XcodeGen recurses.
          - App/AGENTS.md
          - Core/Agent/AGENTS.md
          - Core/Plugins/AGENTS.md
          - Resources/PluginHost/node_modules
      # Keep the marketplace transaction coordinator explicit while the
      # project is regenerated from this spec. This file is intentionally
      # outside the generated group layout used by older checkouts.
      - path: HarnessMobile/Core/Plugins/PluginInstallCoordinator.swift
      - path: HarnessMobile/Core/Plugins/ISHHost/ISHNativeClientSlotRegistry.swift
      - path: HarnessMobile/Core/Trace/SessionPersistence.swift
      # Ralph is part of the production tool catalog and must remain in the
      # application target when the project is regenerated.
      - path: HarnessMobile/Core/Tools/RalphTool.swift
      - path: Vendor/OpenMinisISH/Artifacts/alpine-rootfs.zip
        buildPhase: resources
      - path: Vendor/OpenMinisISH/Artifacts/RootfsPatch.bundle
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile
        PRODUCT_NAME: HarnessMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - target: HarnessMobileLiveActivity
        embed: true
      - target: HarnessMobileShare
        embed: true
      - framework: Vendor/OpenMinisISH/Artifacts/HarnessISH.xcframework
        embed: false
      - sdk: HealthKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: libsqlite3.tbd
      - sdk: libresolv.tbd
    info:
      path: HarnessMobile/Resources/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Harness Mobile
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: "Uses the camera only when you take a photo and hand it to the local OCR tool."
        NSPhotoLibraryUsageDescription: "Reads only the images you choose for local OCR analysis."
        NSPhotoLibraryAddUsageDescription: "Writes to your photo library only when you approve the photos tool to save a result."
        NSContactsUsageDescription: "Reads limited names, phone numbers, and email addresses only when you approve the contacts search tool."
        NSLocationWhenInUseUsageDescription: "Gets your current location once only when you approve the location tool. No background tracking."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Only after you explicitly enable background coarse-location keep-alive and allow Always location, location services with about 3 km accuracy are used while background tasks run. Coordinates are never stored or displayed."
        NSMotionUsageDescription: "Reads recent on-device motion activity estimates only when you approve the motion tool."
        NSMicrophoneUsageDescription: "Accesses the microphone only when you actively use voice input."
        NSSpeechRecognitionUsageDescription: "Performs speech recognition only when you actively use speech-to-text."
        NSCalendarsUsageDescription: "Reads or modifies calendar events only when you approve the calendar tool."
        NSCalendarsFullAccessUsageDescription: "Reads or modifies calendar events only when you approve the calendar tool."
        NSRemindersUsageDescription: "Reads or modifies reminders only when you approve the Reminders tool."
        NSRemindersFullAccessUsageDescription: "Reads or modifies reminders only when you approve the Reminders tool."
        NSAppleMusicUsageDescription: "Accesses your on-device music library only when you approve the media tool."
        NSBluetoothAlwaysUsageDescription: "Scans for or connects to nearby BLE devices only when you approve the Bluetooth tool."
        NSBluetoothPeripheralUsageDescription: "Communicates with nearby BLE devices only when you approve the Bluetooth tool."
        NSLocalNetworkUsageDescription: "Uses the local network only when you approve a feature that needs to reach devices on the same LAN."
        # Desktop DSH bridge over plain HTTP to arbitrary addresses, including
        # bare public IPs (DECISIONS D-013). `NSAllowsLocalNetworking` must stay
        # absent: when it is present iOS ignores `NSAllowsArbitraryLoads`.
        # Model providers remain HTTPS-only in code (CredentialStore).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHealthShareUsageDescription: "Reads selected health data only when you invoke and approve the Apple Health tool. Tool results are sent to the currently configured model service and saved in the on-device session."
        NSHealthUpdateUsageDescription: "Writes selected health data only when you invoke and approve the Apple Health write tool."
        NSHomeKitUsageDescription: "This build does not have the HomeKit capability. Once the signing capability is granted, smart home accessories are queried or controlled only when you approve."
        NFCReaderUsageDescription: "Starts a one-time system scan session only when you explicitly approve the NFC tool."
        NSFaceIDUsageDescription: "Used to verify the device owner before performing sensitive on-device operations."
        BGTaskSchedulerPermittedIdentifiers:
          - com.llf.harnessmobile.continued-processing.*
          - com.llf.harnessmobile.schedule-processing
        UIBackgroundModes:
          - audio
          - location
          - processing
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Device-only tool audit
        script: '"$SRCROOT/Scripts/audit-no-remote-execution.sh"'
        inputFiles:
          - $(SRCROOT)/Scripts/audit-no-remote-execution.sh
        inputFileLists:
          - $(SRCROOT)/Scripts/device-audit-inputs.xcfilelist
        basedOnDependencyAnalysis: false
  HarnessMobileShare:
    type: app-extension
    platform: iOS
    entitlements:
      path: HarnessMobileShare/HarnessMobileShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobileShare
        excludes:
          - Info.plist
          - HarnessMobileShare.entitlements
      - path: HarnessMobile/Core/Storage/ShareHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.share
        PRODUCT_NAME: HarnessMobileShare
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HarnessMobileShare/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: "Share to Harness"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 8
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsMovieWithMaxCount: 8
              NSExtensionActivationSupportsFileWithMaxCount: 8
  HarnessMobileLiveActivity:
    type: app-extension
    platform: iOS
    entitlements:
      path: HarnessMobileLiveActivity/HarnessMobileLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobileLiveActivity
        excludes:
          - Info.plist
          - HarnessMobileLiveActivity.entitlements
      - path: HarnessMobile/Core/Background/HarnessActivityAttributes.swift
      - path: HarnessMobile/Core/Storage/HarnessWidgetProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.liveactivity
        PRODUCT_NAME: HarnessMobileLiveActivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HarnessMobileLiveActivity/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Harness Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HarnessMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarnessMobileTests
        excludes:
          - AGENTS.md
    dependencies:
      - target: HarnessMobile
      - package: HarnessMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.tests
        GENERATE_INFOPLIST_FILE: YES
  HarnessMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HarnessMobileUITests
    dependencies:
      - target: HarnessMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HarnessMobile:
    build:
      targets:
        HarnessMobile: all
        HarnessMobileTests:
          - test
        HarnessMobileUITests:
          - test
    test:
      targets:
        - HarnessMobileTests
        - HarnessMobileUITests
